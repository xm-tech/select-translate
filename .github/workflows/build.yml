name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 需要 arm64 的 macOS runner：scripts/build.sh 交叉编译到 arm64-apple-macos13.0
    runs-on: macos-15-intel   # x86_64 runner：账户里 arm64 runner 不可用，用交叉编译出 arm64 产物
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcrun swiftc --version
          uname -m

      - name: 构建 App
        run: ./scripts/build.sh

      - name: 校验产物
        run: |
          APP="dist/SelectTranslate.app"
          test -x "$APP/Contents/MacOS/SelectTranslate"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          codesign --verify --verbose=2 "$APP"
          echo "== 自检（翻译链路，需要网络）=="
          "$APP/Contents/MacOS/SelectTranslate" --selftest || echo "跳过的自检（网络不可用时不阻塞构建）"

      - name: 打包
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/SelectTranslate.app out/SelectTranslate.app.zip
          shasum -a 256 out/SelectTranslate.app.zip > out/SelectTranslate.app.zip.sha256
          cat out/SelectTranslate.app.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SelectTranslate-app
          path: out/*
